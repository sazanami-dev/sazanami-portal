name: Build and Deploy

# main への push（PR マージ）をトリガーに自動ビルド・デプロイする
on:
  push:
    branches: [main]
  # 手動実行も可能にする（初回検証・再デプロイ用）
  workflow_dispatch:

# デプロイの多重実行を防ぐ（進行中はキャンセルせず順番待ち）
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # イメージ名はこのワークフローが置かれているリポジトリから導出する。
  # ハードコードすると検証用リポジトリでも本番と同じパッケージ名を狙ってしまう。
  IMAGE: ghcr.io/${{ github.repository }}
  # サーバー上のデプロイディレクトリ（docker-compose.yml と実行時 .env を配置済みの場所）
  DEPLOY_DIR: /opt/sazanami-portal

jobs:
  deploy:
    # Tailscale/プライベート網内に配置したセルフホストランナーで実行
    # （DB・自前 Supabase・GHCR に到達可能）
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        # ESLint を Docker 内で実行（ランナーに Node を入れずに済む）。
        # エラーが出たらデプロイを止める。警告は lint の設定上ビルドを落とさない。
        run: docker build --target lint -t sazanami-portal-lint .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push app image
        run: |
          docker build --target runner \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      - name: Run database migrations
        run: |
          docker build --target migrator -t sazanami-portal-migrator .
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            sazanami-portal-migrator

      - name: Deploy
        working-directory: ${{ env.DEPLOY_DIR }}
        # 起動するイメージを latest ではなく SHA で固定する。latest のままだと
        # 「いま動いているのがどのコミットか」が特定できず、切り戻し先も決められない。
        # サーバー上で手動に切り戻す場合は
        #   APP_IMAGE=<image> APP_TAG=<戻したい sha> docker compose up -d
        env:
          APP_IMAGE: ${{ env.IMAGE }}
          APP_TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f
